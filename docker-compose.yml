version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: apexops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: apexops
      POSTGRES_USER: apexops_admin
      POSTGRES_PASSWORD: apexops_secure_password_replace_in_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexops_admin -d apexops"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apexops-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      REFERENCE_DATE: "2026-10-20"
      DATABASE_URL: postgresql://apexops_admin:apexops_secure_password_replace_in_prod@db:5432/apexops
      SECRET_KEY: apexops-prod-secret-key-32chars-min-change-me
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./cache:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
