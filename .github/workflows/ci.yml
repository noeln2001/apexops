name: ApexOps Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite & Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint Check
        run: |
          pip install ruff
          ruff check .

      - name: Run Schema Migration & Initial Seed
        run: |
          python scripts/seed_db.py

      - name: Execute Pytest Suite with Coverage and All-Routes Smoke Test
        run: |
          python -m pytest --cov=. --cov-report=term-missing tests/

      - name: Execute Performance Benchmark Baseline
        run: |
          python -m tests.performance.test_benchmarks

  frontend-build:
    name: Frontend TypeScript, Lint & Vite Bundling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Lint
        working-directory: frontend
        run: npm run lint

      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build
